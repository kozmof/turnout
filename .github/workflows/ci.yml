name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/go/converter/go.mod
          cache-dependency-path: packages/go/converter/go.sum

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production quality gate
        run: pnpm check

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/go/converter/go.mod
          cache-dependency-path: packages/go/converter/go.sum

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2025.1.1"
          install-go: false
          working-directory: packages/go/converter

  fuzz:
    name: Bounded Go Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/go/converter/go.mod
          cache-dependency-path: packages/go/converter/go.sum

      - name: Fuzz lexer
        working-directory: packages/go/converter
        run: go test ./internal/lexer -run='^$' -fuzz=FuzzTokenize -fuzztime=10s

      - name: Fuzz parser
        working-directory: packages/go/converter
        run: go test ./internal/parser -run='^$' -fuzz=FuzzParseFile -fuzztime=10s

      # The two targets above stop at the front end. This one runs the whole
      # pipeline, which is where the lowering paths for local expressions,
      # template patterns and tuple patterns live — the least-covered code in
      # the compiler and the newest part of the language. It gets the longer
      # budget for that reason.
      - name: Fuzz compile pipeline
        working-directory: packages/go/converter
        run: go test . -run='^$' -fuzz=FuzzCompileSource -fuzztime=30s
